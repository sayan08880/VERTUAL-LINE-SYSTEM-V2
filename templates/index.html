<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERTUAL LINE SYSTEM</title>
<link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<header class="desk-header">
  <h1>Virtual Line</h1>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="submit" role="tab" aria-selected="true">New appointment</button>
  <button class="tab-btn" data-tab="list" role="tab" aria-selected="false">Queue list</button>
</nav>

<main>

  <section id="submit-panel" class="panel active">
    <form id="appointment-form" autocomplete="off">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="appointment_date">Appointment date</label>
        <input type="date" id="appointment_date" name="appointment_date" required>
      </div>

      <div class="field">
        <label for="appointment_time_only">Appointment time</label>
        <div class="time-row">
          <input type="text" id="appointment_time_only" name="appointment_time_only"
                 placeholder="HH:MM" maxlength="5" inputmode="numeric"
                 pattern="^(0?[1-9]|1[0-2]):[0-5][0-9]$" required>
          <select id="appointment_ampm" name="appointment_ampm" required>
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="reminder_lead">Send reminder before</label>
        <select id="reminder_lead" name="reminder_lead">
          <option value="1">1 minute before</option>
          <option value="2">2 minutes before</option>
          <option value="5">5 minutes before</option>
          <option value="10">10 minutes before</option>
          <option value="15">15 minutes before</option>
          <option value="30">30 minutes before</option>
          <option value="60">1 hour before</option>
        </select>
      </div>

      <div class="field">
        <label for="message_template">Reminder message (optional)</label>
        <select id="message_template" name="message_template">
          <option value="">Default message</option>
          <option value="Hey {name}, quick reminder — your appointment is at {time}. See you soon!">Friendly</option>
          <option value="Dear {name}, this is a reminder that your appointment is scheduled for {time}. Kindly be on time.">Formal</option>
          <option value="{name}, urgent reminder: your appointment starts at {time}. Please don't be late!">Urgent</option>
          <option value="custom">Write my own…</option>
        </select>
      </div>

      <div class="field" id="custom-message-field" hidden>
        <label for="message_custom">Your message</label>
        <textarea id="message_custom" name="message_custom" placeholder="Type your own reminder message... you can use {name} and {time}"></textarea>
      </div>

      <button type="submit" class="btn-primary">Take a number</button>
    </form>

    <div id="submit-status" class="status-msg" role="status" aria-live="polite"></div>
  </section>

  <section id="list-panel" class="panel">
    <div class="list-header">
      <h2>Booked appointments</h2>
      <div class="list-header-actions">
        <button id="refresh-btn" class="btn-ghost" type="button">Refresh</button>
        <button id="clear-all-btn" class="btn-ghost btn-danger" type="button">Clear all</button>
      </div>
    </div>

    <div class="list-container-wrap">
      <div id="list-container" class="list-container">
        <p class="empty-state">Loading…</p>
      </div>
    </div>
  </section>

</main>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
